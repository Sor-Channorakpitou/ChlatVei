<title>ChlatVei Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a phone-width app column (citizen) and a two-pane workbench (admin), switched by a top bar. */
:root {
  --ink: #14213d;          /* text */
  --ink-soft: #4b5672;
  --paper: #f5f6f9;        /* page ground, faint blue bias */
  --card: #ffffff;
  --line: #dde1ea;
  --accent: #1f3fa6;       /* deep royal blue */
  --accent-soft: #e6ebfa;
  --gold: #b7791f;         /* temple gold, used sparingly */
  --ok: #1e7a4f; --ok-soft: #e3f3ea;
  --warn: #9a6200; --warn-soft: #fbf0d9;
  --bad: #b3261e; --bad-soft: #fbe5e3;
  --font: "Kantumruy Pro", "Noto Sans Khmer", "Khmer OS", system-ui, sans-serif;
  --display: "Moul", "Kantumruy Pro", serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #e8ebf3; --ink-soft: #a3abc0; --paper: #0f1424; --card: #181f33; --line: #2a3350;
  --accent: #8fa8ff; --accent-soft: #232d52; --gold: #e2b25a;
  --ok: #6fd3a0; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2e12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ink: #e8ebf3; --ink-soft: #a3abc0; --paper: #0f1424; --card: #181f33; --line: #2a3350;
  --accent: #8fa8ff; --accent-soft: #232d52; --gold: #e2b25a;
  --ok: #6fd3a0; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2e12; --bad: #ff8a80; --bad-soft: #3d1c1a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 8px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .km { font-family: var(--display); font-size: 22px; color: var(--accent); }
.brand .en { font-weight: 600; letter-spacing: .04em; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
.note { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; }

/* citizen app column */
.app { max-width: 440px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; min-height: 640px; }
.app-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.app-head .back { border: 0; background: var(--accent-soft); color: var(--accent); width: 34px; height: 34px; border-radius: 50%; flex: none; }
.app-head h2 { font-size: 17px; }
.app-body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 4px 12px; font-size: 13px; color: var(--ink-soft); }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; box-shadow: inset 0 3px 0 var(--accent); }

.hero h1 { font-size: 21px; }
.hero p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--accent); border-radius: 14px; padding: 10px 12px; background: var(--card); }
.search input { border: 0; outline: none; flex: 1; min-width: 0; background: transparent; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.result { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 12px 14px; }
.result .t { font-weight: 600; }
.result .s { font-size: 13px; color: var(--ink-soft); }
.result .arrow { color: var(--accent); flex: none; }
.list { display: flex; flex-direction: column; gap: 8px; }
.muted { color: var(--ink-soft); font-size: 13px; }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 10px; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-info { background: var(--accent-soft); color: var(--accent); }

.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.items li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--paper); border-radius: 10px; }
.num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--card); font-size: 12px; display: grid; place-items: center; margin-top: 2px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 9px; }
.src { font-size: 12px; color: var(--ink-soft); }
.src a { color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.gap { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink-soft); }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--accent); color: var(--card); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.ok { background: var(--ok); color: var(--card); }
.btn.bad { background: var(--bad-soft); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

.progress { height: 10px; background: var(--paper); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ok); flex: none; }
.check.done span { text-decoration: line-through; color: var(--ink-soft); }
.kind { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field select, .field textarea, .field input[type=text] { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--card); width: 100%; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 0; font-weight: 600; }
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: var(--accent); }
.toast { background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 10px 12px; font-weight: 600; }

/* admin workbench */
.admin { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .admin { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.qitem { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.qitem[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.qitem .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 560px) { .compare { grid-template-columns: minmax(0, 1fr); } }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.quote { background: var(--paper); border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 14px; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
dt { color: var(--ink-soft); }
dd { margin: 0; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 12px; background: var(--paper); border-radius: 999px; border: 1px solid var(--line); overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; }
.ci { position: relative; height: 14px; background: var(--paper); border-radius: 999px; border: 1px solid var(--line); }
.ci .rng { position: absolute; top: 3px; height: 6px; background: var(--warn); opacity: .45; border-radius: 999px; }
.ci .pt { position: absolute; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); transform: translateX(-5px); }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>

        <button id="l-km" aria-pressed="true">ខ្មែរ</button>
        <button id="l-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <p class="note" id="proto-note"></p>

  <!-- ─── Citizen ─── -->
  <section id="citizen">
    <div class="app">
      <div class="app-head" id="app-head"></div>
      <div class="app-body" id="app-body"></div>
      <nav class="tabs" id="tabs">
        <button data-tab="home" aria-current="page"></button>
        <button data-tab="checklist"></button>
        <button data-tab="feedback"></button>

      <button id="a-dash" aria-pressed="false"></button>

    <div id="admin-review" class="admin">
      <div class="panel">

        <div class="list" id="queue"></div>
      </div>
      <div class="panel" id="detail"></div>
    </div>
    <div id="admin-dash" hidden></div>
  </section>
</div>

const state = { lang: 'km', view: 'citizen', tab: 'home', screen: 'home', q: '', fb: { easy: 0, hard: 0 }, sent: false, adminPage: 'review', sel: 0, khmer: {} };
const t = (k) => T[state.lang][k];
const L = (o) => o[state.lang] ?? o.en;
const money = (n) => n.toLocaleString('en-US') + ' ៛';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Checklist progress is a per-viewer convenience only.
const store = {
  get() { try { return JSON.parse(localStorage.getItem('chlatvei-list') || 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem('chlatvei-list', JSON.stringify(v)); } catch {} },
};
let list = store.get();

function head(title, back) {
  $('#app-head').innerHTML = (back ? `<button class="back" id="back" aria-label="Back">←</button>` : '') + `<h2>${esc(title)}</h2>`;
  if (back) $('#back').onclick = () => { state.screen = 'home'; render(); };
}

function homeScreen() {
  head('ឆ្លាតវៃ · ChlatVei');
  const q = state.q.trim().toLowerCase();
  const hits = q ? SERVICES.filter((s) => (s.km + ' ' + s.en + ' ' + s.keys).toLowerCase().includes(q)) : [];
  $('#app-body').innerHTML = `
    <div class="hero"><h1>${t('heroT')}</h1><p>${t('heroS')}</p></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="${esc(t('ph'))}" value="${esc(state.q)}" aria-label="${esc(t('ph'))}"></label>
    ${q ? `<div class="sec"><div class="label">${t('results')}</div><div class="list">${hits.length ? hits.map(card).join('') : `<p class="muted">${t('none')}</p>`}</div></div>`
        : `<div class="sec"><div class="label">${t('popular')}</div><div class="list">${SERVICES.map(card).join('')}</div></div>
           <div class="chips">${['បណ្ណបើកបរ', 'ម៉ូតូ', 'passport', 'register a car'].map((c) => `<button class="chip" data-q="${c}">${c}</button>`).join('')}</div>`}
    <p class="muted">${t('independent')}</p>`;
  const input = $('#q');
  input.oninput = (e) => { state.q = e.target.value; homeScreen(); const i = $('#q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  document.querySelectorAll('[data-q]').forEach((b) => (b.onclick = () => { state.q = b.dataset.q; homeScreen(); }));
  document.querySelectorAll('[data-slug]').forEach((b) => (b.onclick = () => { state.screen = 'service'; render(); }));
}

function card(s) {
  return `<button class="result" data-slug="${s.slug}"><span><span class="t">${esc(L(s))}</span><br><span class="s">${esc(state.lang === 'km' ? s.kmSub : s.enSub)}</span></span><span class="arrow">→</span></button>`;
}

function checklistScreen() {
  head(t('listTitle'));
  if (!list) { $('#app-body').innerHTML = `<p class="muted">${t('noList')}</p>`; return; }
  const done = list.items.filter((i) => i.done).length;
  $('#app-body').innerHTML = `
    <div class="sec"><div class="label">${t('service')}</div><strong>${esc(L(SERVICES[0]))}</strong></div>
    <div class="sec"><div class="muted">${done} ${t('of')} ${list.items.length} ${t('done')}</div><div class="progress"><i style="width:${(done / list.items.length) * 100}%"></i></div></div>
    <div class="list">${list.items.map((it, i) => `
      <label class="check ${it.done ? 'done' : ''}"><input type="checkbox" id="ck-${i}" data-i="${i}" ${it.done ? 'checked' : ''}>
        <span><span class="kind">${it.k === 'doc' ? t('kDoc') : t('kStep')}</span><br><span>${esc(L(it))}</span></span></label>`).join('')}</div>
    <button class="btn ghost" id="reset">${t('reset')}</button>`;
  document.querySelectorAll('[data-i]').forEach((c) => (c.onchange = () => { list.items[c.dataset.i].done = c.checked; store.set(list); checklistScreen(); }));
  $('#reset').onclick = () => { list = null; store.set(null); checklistScreen(); };
}

function feedbackScreen() {
  head(t('fbTitle'));
  const s = SERVICES[0];
  const scale = (key) => `<div class="scale">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-k="${key}" data-n="${n}" aria-pressed="${state.fb[key] === n}">${n}</button>`).join('')}</div>`;
  $('#app-body').innerHTML = state.sent ? `<div class="toast">${t('fbThanks')}</div>` : `
    <form id="fb" class="sec" novalidate>
      <div class="muted">${t('service')}: <strong>${esc(L(s))}</strong></div>
      <div class="field"><span>${t('fbEasy')}</span>${scale('easy')}</div>
      <div class="field"><span>${t('fbHard')}</span>${scale('hard')}</div>
      <div class="field"><label for="fb-step">${t('fbStep')}</label>

      <p class="muted" id="fb-err" hidden>${t('fbNeed')}</p>
      <button class="btn" type="submit">${t('fbSend')}</button>

  document.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { state.fb[b.dataset.k] = +b.dataset.n; feedbackScreen(); }));

  if (f) f.onsubmit = (e) => { e.preventDefault(); if (!state.fb.easy && !state.fb.hard) { $('#fb-err').hidden = false; return; } state.sent = true; feedbackScreen(); };

  $('#queue').innerHTML = QUEUE.map((q, i) => `
    <button class="qitem" data-sel="${i}" aria-current="${i === state.sel}">
      <span class="top"><span class="badge ${q.decided === 'APPROVED' ? 'b-ok' : q.decided === 'REJECTED' ? 'b-bad' : 'b-warn'}">${q.decided ?? 'PENDING'}</span><span class="muted">${q.type}</span></span>
      <strong>${esc(q.values.textEn || q.values.titleEn || q.values.labelEn)}</strong>
      <span class="muted">${esc(q.svc)} · ${q.origin}${q.confidence ? ' · ' + Math.round(q.confidence * 100) + '%' : ''}</span>

  document.querySelectorAll('#tabs button').forEach((b) => { b.textContent = t(b.dataset.tab); b.toggleAttribute('aria-current', b.dataset.tab === state.tab); if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); });
  $('#a-review').textContent = state.lang === 'km' ? 'ពិនិត្យខ្លឹមសារ' : 'Review queue';
  $('#a-dash').textContent = state.lang === 'km' ? 'ផ្ទាំងគ្រប់គ្រង' : 'Dashboard';
  $('#a-review').setAttribute('aria-pressed', state.adminPage === 'review'); $('#a-dash').setAttribute('aria-pressed', state.adminPage === 'dash');
  $('#admin-review').hidden = state.adminPage !== 'review'; $('#admin-dash').hidden = state.adminPage !== 'dash';

  if (state.view === 'citizen') {
    if (state.tab === 'home') (state.screen === 'service' ? serviceScreen : homeScreen)();
    if (state.tab === 'checklist') checklistScreen();
    if (state.tab === 'feedback') feedbackScreen();
  } else {
    state.adminPage === 'review' ? renderQueue() : renderDash();
  }
}

$('#l-km').onclick = () => { state.lang = 'km'; render(); };
$('#l-en').onclick = () => { state.lang = 'en'; render(); };
$('#v-citizen').onclick = () => { state.view = 'citizen'; render(); };
$('#v-admin').onclick = () => { state.view = 'admin'; render(); };
$('#a-review').onclick = () => { state.adminPage = 'review'; render(); };
$('#a-dash').onclick = () => { state.adminPage = 'dash'; render(); };
document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { state.tab = b.dataset.tab; state.screen = b.dataset.tab === 'home' ? 'home' : b.dataset.tab; render(); }));
render();
</script>
