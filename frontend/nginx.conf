# Serves the Angular PWA and proxies /api to the backend (same origin, so the
# SameSite=Strict refresh cookie works and no CORS is needed).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # Security headers (Phase 9 review). Angular injects component <style> tags, hence 'unsafe-inline' for styles only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "DENY" always;
  # Add HSTS where TLS terminates (load balancer or host nginx): Strict-Transport-Security "max-age=31536000; includeSubDomains"

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so clients cannot inject their own X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # The service worker and app shell must never be cached, or users get stuck on old versions.
  # (`expires` is used instead of add_header so the server-level security headers are kept:
  # any add_header inside a location would replace them.)
  location = /ngsw-worker.js { expires -1; }
  location = /ngsw.json { expires -1; }
  location = /index.html { expires -1; }

  # Hashed build files can be cached for a long time.
  location ~* \.(?:js|css|woff2?|png|svg|ico|webmanifest)$ {
    expires 30d;
    try_files $uri =404;
  }

  # Client-side routes fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
